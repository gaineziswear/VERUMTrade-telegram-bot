name: VERUM Platform Domain Tests

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/verum-platform.yml"
  push:
    branches:
      - main
      - "feat/verum-ai-multichannel-platform"
    paths:
      - "platform/**"
      - ".github/workflows/verum-platform.yml"

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run platform tests
        run: npm test
